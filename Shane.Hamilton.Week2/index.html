<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Musical Artists</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="js/script.js" defer></script>
</head>

<body --bs-body-color-rgb="255, 255, 255" --bs-body-color-rgb="33, 37, 41" --bs-body-bg-rgb="255, 255, 255" class="bg-dark text-light">
    <h1 class="text-center">Favorite Musical Artists</h1>
    <hr>
    <br>
    <div class="row align-items-center">
        <div class="col-sm-4" id="images" style="padding-left:25px;">
            <div id="carousel" class="carousel slide carousel-fade" data-bs-theme="dark">
                 <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    <button type="button" data-bs-target="#carousel" data-bs-slide-to="3" aria-label="Slide 4"></button>
                    <button type="button" data-bs-target="#carousel" data-bs-slide-to="4" aria-label="Slide 5"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="images/bimbocore.jpg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="images/halsey.avif" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="images/weedkiller.webp" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="images/bmth.jpg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="images/hielung.jpg" class="d-block w-100" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

    
        <div class="col-sm-8" id="table" style="padding-right:25px;">
            <div class="row row-cols-4" style="padding-bottom: 10px;">
            <input type="text" id="AddArtist" class="col" placeholder="Add an artist">
            <input type="text" id="AddGenre" class="col" placeholder="Add a genre">
            <input type="text" id="AddSong" class="col" placeholder="Add top songs">
            <button type="button" class="btn btn-secondary btn-sm col" id="addButton" style="--bs-btn-padding-x-sm: .5rem;" >Add</button>
            </div>
            <table class="table table-striped table-hover table-bordered" id="artistTable">
                <thead>
                    <tr>
                        <th scope="col">Artist</th>
                        <th scope="col">Genre</th>
                        <th scope="col">Top Song(s)</th>
                    </tr>
                </thead>
                <tbody id="artistTableBody">
                    
                </tbody>
            </table>
            
        </div>
        
    </div>

    </div>
    <br>
    <hr>
    <br>
    <footer class="text-center small">
        <p>copyright &copy; 10/27/2026 Shane Hamilton || Week 2 JSON & Bootstrap Assignment || Innovative Web Development</p>
</body>

</html>
