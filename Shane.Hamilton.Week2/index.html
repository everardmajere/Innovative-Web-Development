<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Musical Artists</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="js/script.js" defer></script>
</head>

<body --bs-body-color-rgb="255, 255, 255" --bs-body-color-rgb="33, 37, 41" --bs-body-bg-rgb="255, 255, 255" class="bg-dark text-light">
    <h1 class="text-center">Favorite Musical Artists</h1>

    <div class="row align-items-center">
        <div class="col-sm-4" id="images" style="padding-left:25px;">
            <div id="carouselExampleFade" class="carousel slide carousel-fade" data-bs-theme="dark">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="images/bimbocore.jpg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="images/halsey.avif" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="images/weedkiller.webp" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="images/bmth.jpg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="images/hielung.jpg" class="d-block w-100" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

    
        <div class="col-sm-8" id="table" style="padding-right:25px;">
            
            
            <table class="table table-striped table-hover table-bordered" id="artistTable">
                <thead>
                    <tr>
                        <th scope="col">Artist</th>
                        <th scope="col">Genre</th>
                        <th scope="col">Top Song(s)</th>
                    </tr>
                </thead>
                <tbody id="artistTableBody">
                    
                </tbody>
            </table>
            
        </div>
        
    </div>

    </div>
</body>

</html>
